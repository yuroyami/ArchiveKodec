site_name: KiteArchive
site_url: https://yuroyami.github.io/KiteArchive/
site_description: >-
  Pure-Kotlin compression codecs and archive readers for Kotlin Multiplatform:
  DEFLATE, gzip, zlib, LZ4 and Snappy, ZIP read and write (+ZIP64), TAR, ar and
  cpio readers, and checksums. No JNI, no cinterop. Android, iOS, JVM, JS.
site_author: yuroyami
copyright: Copyright &copy; 2026 yuroyami, Apache-2.0

repo_name: yuroyami/KiteArchive
repo_url: https://github.com/yuroyami/KiteArchive
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share

extra_css:
  - theme/kite.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yuroyami/KiteArchive
    - icon: material/package-variant-closed
      link: https://central.sonatype.com/namespace/io.github.yuroyami

nav:
  - Home: index.md
  - API reference: https://yuroyami.github.io/KiteArchive/api/
