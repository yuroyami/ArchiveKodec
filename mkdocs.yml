site_name: ArchiveKodec
site_url: https://yuroyami.github.io/ArchiveKodec/
site_description: >-
  Compression codecs and archive formats in pure Kotlin for Kotlin Multiplatform: DEFLATE,
  bzip2, xz, zstd, brotli, LZ4 and more, ZIP, TAR, ar and cpio read and write, and 7z, RAR,
  ISO 9660, CAB, WIM and SquashFS read. No JNI, no cinterop.
site_author: yuroyami
copyright: Copyright &copy; 2026 yuroyami, Apache-2.0

repo_name: yuroyami/ArchiveKodec
repo_url: https://github.com/yuroyami/ArchiveKodec
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share

extra_css:
  - theme/kite.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yuroyami/ArchiveKodec
    - icon: material/package-variant-closed
      link: https://central.sonatype.com/namespace/io.github.yuroyami

nav:
  - Home: index.md
  - Guides:
      - Compression: compression.md
      - Reading archives: reading.md
      - Entry names and Zip-Slip: entry-names.md
      - Encrypted archives: encryption.md
      - Writing archives: writing.md
      - Files and extraction: files.md
      - Custom codecs and formats: extending.md
  - Other languages:
      - Java: java.md
      - Swift: swift.md
      - JavaScript and TypeScript: javascript.md
  - Reference:
      - Format support: formats.md
      - Limits: limits.md
      - Benchmarks: benchmarks.md
      - API reference: https://yuroyami.github.io/ArchiveKodec/api/
