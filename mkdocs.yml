site_name: KiteArchive
site_url: https://yuroyami.github.io/KiteArchive/
site_description: >-
  A pure-Kotlin compression & archive toolkit: from-scratch Kotlin Multiplatform
  ports of zlib/DEFLATE, gzip, zlib, TAR (and, on the roadmap, bzip2, LZMA/xz,
  zstd, brotli). No JNI, no cinterop. Android, iOS, JVM, JS.
site_author: yuroyami
copyright: Copyright &copy; 2026 yuroyami, Apache-2.0

repo_name: yuroyami/KiteArchive
repo_url: https://github.com/yuroyami/KiteArchive
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/folder-zip
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yuroyami/KiteArchive
    - icon: material/package-variant-closed
      link: https://central.sonatype.com/namespace/io.github.yuroyami

nav:
  - Home: index.md
