<title id="title">ArchiveKodec — Compression seam</title>
<desc id="desc">An interlocking zipper runs through the kite as its spine; inward chevrons express compression and a slider opens the archive. A short-tailed geometric kite in Kotlin violet, magenta and orange.</desc>
