#Gradle
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.daemon=true

org.gradle.toolchains.jvm.version=21

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6G

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.incremental.jvm.fir=true

android.uniquePackageNames=false
android.dependency.useConstraints=false

android.newDsl=true
android.builtInKotlin=true

#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.stability.nowarn=true
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.apple.xcodeCompatibility.nowarn=true

#Dokka (v2 generator, aggregated API site at build/dokka/html)
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

#ArchiveKodec
group=io.github.yuroyami
version=0.1.0

#Publishing (vanniktech). Shared POM + signing. Maven Central requires signed
#artifacts, so this is on; a local dogfood publish can override it with
#-PRELEASE_SIGNING_ENABLED=false. Per-module POM_NAME/POM_DESCRIPTION
#live in each module's gradle.properties. ArchiveKodec is Apache-2.0 (specification implementations
#and ports of permissively licensed references; see reference/REFERENCES.md).
SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=true
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/yuroyami/ArchiveKodec
POM_LICENCE_NAME=The Apache License, Version 2.0
POM_LICENCE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_DEVELOPER_ID=yuroyami
POM_DEVELOPER_NAME=yuroyami
POM_DEVELOPER_URL=https://github.com/yuroyami
POM_SCM_URL=https://github.com/yuroyami/ArchiveKodec
POM_SCM_CONNECTION=scm:git:git://github.com/yuroyami/ArchiveKodec.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/yuroyami/ArchiveKodec.git
