POM_NAME=KiteArchive
POM_DESCRIPTION=Pure-Kotlin compression and archive core for Kotlin Multiplatform: DEFLATE, gzip, zlib, LZ4 and Snappy codecs, ZIP read/write (+ZIP64), TAR/ar/cpio readers, CRC and Adler checksums, a magic sniffer, and opt-in path-traversal and decompression-bomb checks. Whole-array API, no streaming. kotlin-stdlib only; Android, iOS, JVM, JS.
