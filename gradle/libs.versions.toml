[versions] #######################################################################################
# Toolchain — kept in lock-step with KiteTorrent / KitePDF so the Kite lineage builds
# with one shared stack.
kotlin = "2.4.10"
agp = "9.2.1"
vanniktechPublish = "0.36.0"
dokka = "2.2.0"

# Tier 2 (:archivekodec-io) only. The :archivekodec core stays kotlin-stdlib-only.
kotlinxIo = "0.9.1"

[libraries] ######################################################################################
# Tier 2 I/O — kotlinx-io provides the RawSource/RawSink + filesystem the core
# deliberately doesn't touch.
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }

[plugins] ########################################################################################
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechPublish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
