product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64
    - tvosArm64
    - tvosSimulatorArm64
    - watchosArm32
    - watchosArm64
    - watchosDeviceArm64
    - watchosSimulatorArm64
    - linuxX64
    - linuxArm64
    - mingwX64
    - androidNativeArm32
    - androidNativeArm64
    - androidNativeX86
    - androidNativeX64

description: >-
  Platform cryptography for ArchiveKodec's encrypted archives: a CryptoProvider backed by cryptography-kotlin (JDK,
  OpenSSL 3, Apple) for WinZip AES and 7z AES. Android, JVM, Apple, Linux, Windows and Android Native.

apply:
  - ../library.module-template.yaml

dependencies:
  - //archivekodec: exported
  - $libs.cryptography.core: exported
  - $libs.cryptography.provider.optimal

settings:
  kotlin:
    optIns: [ io.github.yuroyami.archivekodec.ExperimentalArchiveImplementation ]
  android:
    namespace: io.github.yuroyami.archivekodec.crypto
  publishing:
    pom:
      name: ArchiveKodec Crypto

# Gradle named the klib "io.github.yuroyami:archivekodec-crypto". Keep that name, or libraries built against
# earlier releases fail to link on Kotlin/Native. Set it per platform: on @native, it also
# renames the klibs of shared native code, which must keep their own names.
settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:archivekodec-crypto, -Xshort-module-name=archivekodec-crypto ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:archivekodec-crypto, -Xshort-module-name=archivekodec-crypto ]

