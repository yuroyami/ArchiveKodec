plugins:
  abi-check:
    enabled: true
    # The klibAbi check reads the klibs of these platforms, so run `./kotlin build` first.
    klibPlatforms: [ androidNativeArm32, androidNativeArm64, androidNativeX64, androidNativeX86, iosArm64, iosSimulatorArm64, iosX64, linuxArm64, linuxX64, macosArm64, mingwX64, tvosArm64, tvosSimulatorArm64, watchosArm32, watchosArm64, watchosDeviceArm64, watchosSimulatorArm64 ]
  dokka:
    enabled: true
    moduleName: archivekodec-crypto
    includes: [ Module.md ]
    customStyleSheets: [ ../docs/api-theme/kite.css ]
    templatesDir: ../dokka-templates
    footerMessage: Apache-2.0 · ArchiveKodec is part of the Kite family.
    sourceLinkUrl: https://github.com/yuroyami/ArchiveKodec/blob/main/archivekodec-crypto/src
