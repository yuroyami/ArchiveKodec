POM_NAME=ArchiveKodec
POM_DESCRIPTION=Pure-Kotlin compression and archive core for Kotlin Multiplatform: DEFLATE, gzip, zlib, LZ4 and Snappy codecs, ZIP read/write (+ZIP64), TAR/ar/cpio readers, CRC and Adler checksums, a magic sniffer, default output-size and compression-ratio limits, and opt-in path checks. Whole-array API, no streaming. kotlin-stdlib only; Android, JVM, JS, Wasm, Apple, Linux and Windows.
