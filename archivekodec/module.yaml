plugins:
  jvm-module:
    enabled: true
    name: io.github.yuroyami.archivekodec
    requires: [ kotlin.stdlib ]
  version-constant:
    enabled: true
    file: src/io/github/yuroyami/archivekodec/GeneratedVersion.kt
  abi-check:
    enabled: true
    # The klibAbi check reads the klibs of these platforms, so run `./kotlin build` first.
    klibPlatforms: [ androidNativeArm32, androidNativeArm64, androidNativeX64, androidNativeX86, iosArm64, iosSimulatorArm64, iosX64, js, linuxArm64, linuxX64, macosArm64, mingwX64, tvosArm64, tvosSimulatorArm64, wasmJs, wasmWasi, watchosArm32, watchosArm64, watchosDeviceArm64, watchosSimulatorArm64 ]
  dokka:
    enabled: true
    moduleName: archivekodec
    includes: [ Module.md ]
    # The Apple NSData functions and the JavaScript facade. The -io and crypto platform folders hold no public API.
    platformSourceDirs: [ src@apple, src@js ]
    customStyleSheets: [ ../docs/api-theme/kite.css ]
    templatesDir: ../dokka-templates
    footerMessage: Apache-2.0 · ArchiveKodec is part of the Kite family.
    sourceLinkUrl: https://github.com/yuroyami/ArchiveKodec/blob/main/archivekodec/src
    # `./kotlin do dokkaSite` merges the pages of these modules into build/dokka/html.
    siteName: ArchiveKodec
    siteModules: [ archivekodec, archivekodec-io, archivekodec-crypto ]
    siteIncludes: [ ../archivekodec-io/Module.md, ../archivekodec-crypto/Module.md ]
