product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - js
    - wasmJs
    - wasmWasi
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64
    - tvosArm64
    - tvosSimulatorArm64
    - watchosArm32
    - watchosArm64
    - watchosDeviceArm64
    - watchosSimulatorArm64
    - linuxX64
    - linuxArm64
    - mingwX64
    - androidNativeArm32
    - androidNativeArm64
    - androidNativeX86
    - androidNativeX64

description: >-
  Pure-Kotlin compression and archive core for Kotlin Multiplatform: DEFLATE, Deflate64, gzip, zlib, bzip2, LZMA,
  xz, zstd, brotli, PPMd, LZ4 and Snappy codecs; ZIP, TAR, ar and cpio readers and writers; 7z, RAR, ISO 9660, CAB,
  WIM and SquashFS readers; checksums, a format sniffer, output-size and compression-ratio limits, and path checks.
  kotlin-stdlib only; Android, JVM, JS, Wasm, Apple, Linux, Windows and Android Native.

apply:
  - ../library.module-template.yaml

# Intentionally no dependencies. ArchiveKodec core depends on kotlin-stdlib only.

settings:
  kotlin:
    # The built-in codecs and readers, and the test doubles, implement the interfaces
    # that outside implementations must opt in to.
    optIns: [ io.github.yuroyami.archivekodec.ExperimentalArchiveImplementation ]
  jvm:
    test:
      # The opt-in Silesia corpus test (see CONTRIBUTING.md) holds 50 MB files and their encodings at once.
      freeJvmArgs: [ -Xmx4g ]
  android:
    namespace: io.github.yuroyami.archivekodec
  publishing:
    pom:
      name: ArchiveKodec

# Only the published classes have the Java 8 floor. The JVM tests compare against newer
# JDK APIs (CRC32C, HexFormat, readAllBytes).
test-settings:
  jvm:
    release: 21

# Gradle named the klib "io.github.yuroyami:archivekodec". Keep that name, or libraries built against
# earlier releases fail to link on Kotlin/Native. Set it per platform: on @native, it also
# renames the klibs of shared native code, which must keep their own names.
settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:archivekodec ]

settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:archivekodec ]

settings@wasmWasi:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:archivekodec ]

settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:archivekodec, -Xshort-module-name=archivekodec ]

settings@iosSimulatorArm64:
