name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      failure_canary:
        description: Insert a deliberately failing JVM test to verify the gate (never deploys Pages)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  portable:
    name: JVM, Node, Wasm, Linux, Android and Java consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-
      - name: Install the required Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Run verification
        env:
          FAILURE_CANARY: ${{ inputs.failure_canary || false }}
        run: |
          args=()
          if [[ "$FAILURE_CANARY" == true ]]; then args+=(--failure-canary); fi
          python3 integration-tests/ci/run.py portable "${args[@]}"
      - name: Retain test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-test-reports
          path: build/reports/
          retention-days: 14

  apple:
    name: Apple simulators, macOS and Swift consumers
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-
      - name: Check the Apple toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Install the Android SDK for the complete build
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Run verification
        run: python3 integration-tests/ci/run.py apple
      - name: Retain test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-test-reports
          path: build/reports/
          retention-days: 14

  windows:
    name: mingwX64 tests
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin.bat', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-
      - name: Run verification
        run: python integration-tests/ci/run.py windows

  benchmarks:
    name: JVM and Node benchmark smoke check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-
      - name: Install the Android SDK for the project model
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Verify the comparison gate
        run: python3 -B -m unittest discover -s benchmarks -p 'test_*.py'
      - name: Run both runtimes and compare the baseline
        run: python3 benchmarks/run.py --check
      - name: Retain benchmark samples
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: benchmarks/build/results.json
          retention-days: 14

  verification:
    name: Verification
    needs: [portable, apple, windows, benchmarks]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every platform lane and the benchmark check to pass
        env:
          PORTABLE_RESULT: ${{ needs.portable.result }}
          APPLE_RESULT: ${{ needs.apple.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          BENCHMARK_RESULT: ${{ needs.benchmarks.result }}
        run: |
          test "$PORTABLE_RESULT" = success
          test "$APPLE_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$BENCHMARK_RESULT" = success

  docs:
    name: Build documentation
    needs: verification
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.failure_canary }}
    # macOS, because the Apple pages of the API reference need the Kotlin/Native macOS platform libraries.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build the docs site
        run: |
          python -m pip install -r docs/requirements.txt
          mkdocs build --strict --site-dir site
      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-
      - name: Install the Android SDK for the project model
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Generate and merge the Dokka API reference
        run: |
          # Dokka reads the standard libraries of the documented platform folders from the toolchain cache.
          ./kotlin build -m archivekodec -p macosArm64 -p js
          # `do` is a command of the kotlin script here, not the shell keyword.
          # shellcheck disable=SC1010
          ./kotlin do dokka && ./kotlin do dokkaSite
          mkdir -p site/api
          cp -r build/dokka/html/. site/api/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    name: Deploy documentation
    needs: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
