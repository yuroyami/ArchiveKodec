name: Publish

# A release of ArchiveKodec: every platform built on one Mac, checked, signed and published to
# Maven Central. The workflow runs when the owner publishes a GitHub release. Run it by hand for a
# dry run, which builds and signs but uploads nothing. It never runs on a pull request.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign the artifacts without uploading them
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  publish:
    name: Publish to Maven Central
    # Apple platforms build only on a Mac, and a release publishes every platform from one build.
    runs-on: macos-26
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    # The secrets sit on the steps that sign or publish, not on the job, so the steps that download
    # and run the toolchain never see them. The job restores no cache: a release builds from the
    # checkout and fresh downloads only.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the Android SDK for the complete build
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"'

      # settings.publishing.version of library.module-template.yaml, the version of every module.
      - name: Read the version
        id: version
        run: |
          version=$(awk '/^  publishing:/ { found = 1 } found && /^    version:/ { print $2; exit }' library.module-template.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ArchiveKodec $version"

      # A release whose tag does not name the version would publish another version than the tag says.
      - name: Check that the tag names the version
        if: ${{ github.event_name == 'release' }}
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "$VERSION" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "::error::the release tag $TAG does not name version $VERSION of library.module-template.yaml"
            exit 1
          fi

      - name: Refuse to upload a snapshot version
        if: ${{ github.event_name == 'release' || !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          case "$VERSION" in
            *-SNAPSHOT) echo "::error::$VERSION is a snapshot version; remove the suffix first (CONTRIBUTING.md, Version and release)"; exit 1 ;;
          esac

      # One platform at a time, as in the macOS lane of CI: the runner has too little memory for one
      # build of all of them.
      - name: Build every platform, check the public API and the version
        run: python3 integration-tests/ci/run.py release

      # Every run signs into Maven Local first, so the log shows the files a release holds before
      # any upload.
      - name: Build and sign into Maven Local
        env:
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./kotlin publish mavenLocal --non-transitive -m archivekodec -m archivekodec-io -m archivekodec-crypto

      - name: List the signed artifacts
        run: find ~/.m2/repository/io/github/yuroyami -type f | sort

      - name: Publish to Maven Central
        if: ${{ github.event_name == 'release' || !inputs.dry_run }}
        env:
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./kotlin publish mavenCentral --non-transitive -m archivekodec -m archivekodec-io -m archivekodec-crypto
