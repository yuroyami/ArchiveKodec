plugins:
  jvm-module:
    enabled: true
    name: io.github.yuroyami.archivekodec.io
    requires: [ kotlin.stdlib, io.github.yuroyami.archivekodec, kotlinx.io.core, kotlinx.coroutines.core ]
    sourceDirs: [ src, src@jvmAndAndroid ]
  abi-check:
    enabled: true
    # The klibAbi check reads the klibs of these platforms, so run `./kotlin build` first.
    klibPlatforms: [ androidNativeArm32, androidNativeArm64, androidNativeX64, androidNativeX86, iosArm64, iosSimulatorArm64, iosX64, js, linuxArm64, linuxX64, macosArm64, mingwX64, tvosArm64, tvosSimulatorArm64, wasmJs, wasmWasi, watchosArm32, watchosArm64, watchosDeviceArm64, watchosSimulatorArm64 ]
  dokka:
    enabled: true
    moduleName: archivekodec-io
    includes: [ Module.md ]
    customStyleSheets: [ ../docs/api-theme/kite.css ]
    templatesDir: ../dokka-templates
    footerMessage: Apache-2.0 · ArchiveKodec is part of the Kite family.
    sourceLinkUrl: https://github.com/yuroyami/ArchiveKodec/blob/main/archivekodec-io/src
