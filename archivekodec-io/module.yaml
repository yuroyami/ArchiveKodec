product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - js
    - wasmJs
    - wasmWasi
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64
    - tvosArm64
    - tvosSimulatorArm64
    - watchosArm32
    - watchosArm64
    - watchosDeviceArm64
    - watchosSimulatorArm64
    - linuxX64
    - linuxArm64
    - mingwX64
    - androidNativeArm32
    - androidNativeArm64
    - androidNativeX86
    - androidNativeX64

description: >-
  Files and kotlinx-io for ArchiveKodec: a FileRandomAccessSource that reads an archive from disk on demand,
  extract to write chosen entries to RawSinks, and adapters between RawSource, RawSink and the core's codecs.
  Android, JVM, JS, Wasm, Apple, Linux, Windows and Android Native.

apply:
  - ../library.module-template.yaml

# Source groups that the default hierarchy does not have.
aliases:
  - jvmAndAndroid: [ jvm, android ]
  # Every native platform except mingwX64: Apple, Linux and Android native share the POSIX file API.
  - posix: [ iosArm64, iosSimulatorArm64, iosX64, macosArm64, tvosArm64, tvosSimulatorArm64, watchosArm32, watchosArm64, watchosDeviceArm64, watchosSimulatorArm64, linuxX64, linuxArm64, androidNativeArm32, androidNativeArm64, androidNativeX86, androidNativeX64 ]

dependencies:
  - //archivekodec: exported
  - $libs.kotlinx.io.core: exported
  - $libs.kotlinx.coroutines.core: exported

test-dependencies:
  - $libs.kotlinx.coroutines.test

settings:
  android:
    namespace: io.github.yuroyami.archivekodec.io
  publishing:
    pom:
      name: ArchiveKodec IO

# Gradle named the klib "io.github.yuroyami:archivekodec-io". Keep that name, or libraries built against
# earlier releases fail to link on Kotlin/Native. Set it per platform: on @native, it also
# renames the klibs of shared native code, which must keep their own names.
settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:archivekodec-io ]

settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:archivekodec-io ]

settings@wasmWasi:
